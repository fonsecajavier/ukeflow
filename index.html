<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UkeFlow - Ukulele Chord Progressions</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>🎸 UkeFlow</h1>
            <div class="header-controls">
                <div class="song-selector-wrapper">
                    <input type="text" id="song-selector" list="song-list"
                           placeholder="Search for a song..."
                           aria-label="Search for a song"
                           autocomplete="off">
                    <button type="button" id="song-selector-clear" class="clear-btn" aria-label="Clear selection">&times;</button>
                </div>
                <datalist id="song-list"></datalist>
            </div>
        </header>

        <div class="song-info" id="song-info" style="display: none;">
            <div class="song-meta">
                <h2 id="song-title"></h2>
                <span id="song-artist"></span>
            </div>
            <div class="song-controls">
                <div class="key-display">
                    Key: <strong id="song-key"></strong>
                </div>
                <div class="transpose-control">
                    <label for="transpose-select">Transpose:</label>
                    <select id="transpose-select">
                        <option value="0">Original</option>
                        <option value="1">+1</option>
                        <option value="2">+2</option>
                        <option value="3">+3</option>
                        <option value="4">+4</option>
                        <option value="5">+5</option>
                        <option value="6">+6</option>
                        <option value="-5">-5</option>
                        <option value="-4">-4</option>
                        <option value="-3">-3</option>
                        <option value="-2">-2</option>
                        <option value="-1">-1</option>
                    </select>
                </div>
                <button id="toggle-progression" class="toggle-btn">
                    Show as Numbers
                </button>
            </div>
        </div>

        <section class="chord-reference" id="chord-reference" style="display: none;">
            <details class="scale-reference" id="scale-reference">
                <summary>Scale Reference</summary>
                <div class="scale-grid" id="scale-grid"></div>
            </details>
            <details class="progression-summary" id="progression-summary">
                <summary>Progression Summary</summary>
                <div class="progression-content" id="progression-content"></div>
            </details>
            <h3>Chords Used</h3>
            <div class="chord-grid" id="chord-grid"></div>
        </section>

        <section class="lyrics-section" id="lyrics-section" style="display: none;">
            <div class="lyrics-container" id="lyrics-container"></div>
        </section>

        <div class="welcome-message" id="welcome-message">
            <p>Select a song to start learning ukulele progressions!</p>
        </div>
    </div>

    <!-- Chord Popup Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content" id="modal-content">
            <button class="modal-close" id="modal-close">&times;</button>
            <div class="modal-chord" id="modal-chord"></div>
        </div>
    </div>

    <script src="chords.js"></script>
    <script src="app.js"></script>
</body>
</html>
